<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Querida Isaara, con mucho cariño 💛</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Capa de fondo donde se dibujan pétalos, brillos y flores -->
  <div class="scene" id="scene" aria-hidden="true">
    <div class="stage-glow"></div>
    <div class="glow-layer" id="glowLayer"></div>
    <div class="petal-layer" id="petalLayer"></div>
    <div class="flower-field" id="flowerField"></div>
  </div>

  <!-- Contenido principal -->
  <main class="content">
    <div class="badge">🌻</div>

    <h1 class="title" id="mainTitle">Querida Isaara, con mucho Amor💛</h1>

    <p class="subtitle" id="subtitle">
      Mereces recibir flores todos los dias, mi hermosa Sherlyn💗
    </p>

    <button class="gift-button" id="giftButton" type="button">
      <span id="buttonLabel">Abre tu hermoso regalo 🌻</span>
    </button>

    <p class="hint" id="hint">Te amo mucho mi preciosa </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
